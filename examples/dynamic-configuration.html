<!DOCTYPE html>
<html>
<head>
    <title>Dynamic Lookup Configuration Examples</title>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/js/select2.min.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/css/select2.min.css" rel="stylesheet" />
    <script src="src/index.js"></script>
</head>
<body>
    <h2>Dynamic Lookup Configuration Examples</h2>
    
    <h3>Single Entity Lookup (Contact)</h3>
    <p>Automatically configured from DOM data-view-layouts</p>
    <input type="hidden" id="sch_personinvolved" />
    <input type="text" id="sch_personinvolved_name" readonly />
    <input type="hidden" id="sch_personinvolved_entityname" />
    
    <h3>Polymorphic Lookup (Location)</h3>
    <p>Automatically configured for multiple entities from DOM</p>
    <input type="hidden" id="sch_location" />
    <input type="text" id="sch_location_name" readonly />
    <input type="hidden" id="sch_location_entityname" />

    <script>
        $(document).ready(function() {
            // Example 1: Automatic configuration for single entity lookup
            // Requires the contact lookup modal to exist in DOM with data-view-layouts
            try {
                $("#sch_personinvolved").lookupToSelect({
                    placeholder: "Search for a person...",
                    minimumInputLength: 1
                });
                console.log("Contact lookup configured automatically");
            } catch (error) {
                console.log("Contact lookup requires DOM modal:", error.message);
            }

            // Example 2: Automatic configuration for polymorphic lookup  
            // Requires the location lookup modal to exist in DOM with data-view-layouts
            try {
                $("#sch_location").lookupToSelect({
                    placeholder: "Search locations...",
                    minimumInputLength: 2
                });
                console.log("Location lookup configured automatically");
            } catch (error) {
                console.log("Location lookup requires DOM modal:", error.message);
            }

            // Example 3: Manual override (still supported)
            $("#manual_lookup").lookupToSelect({
                entitySetName: "contacts",
                idFieldName: "contactid", 
                textFieldName: "fullname",
                targetTableLogicalName: "contact",
                placeholder: "Manual configuration..."
            });

            // Example 4: Manual polymorphic override
            $("#manual_poly_lookup").lookupToSelect({
                entities: [
                    {
                        entitySetName: "accounts",
                        idFieldName: "accountid",
                        textFieldName: "name", 
                        targetTableLogicalName: "account",
                        displayName: "Accounts"
                    },
                    {
                        entitySetName: "contacts",
                        idFieldName: "contactid",
                        textFieldName: "fullname",
                        targetTableLogicalName: "contact", 
                        displayName: "Contacts"
                    }
                ],
                placeholder: "Search customers..."
            });
        });
    </script>

    <!-- Note: In a real Power Pages environment, these modals would be automatically generated -->
    <!-- This is just for demonstration of the concept -->
    <div id="sch_personinvolved_lookupmodal" style="display: none;">
        <div class="entity-lookup">
            <div class="entity-grid" data-view-layouts="W3siQ29uZmlndXJhdGlvbiI6eyJFbnRpdHlOYW1lIjoiY29udGFjdCIsIlByaW1hcnlLZXlOYW1lIjoiY29udGFjdGlkIn0sIlZpZXdOYW1lIjoiQ29udGFjdHMgTG9va3VwIFZpZXcifV0=">
                <!-- Base64 encoded: [{"Configuration":{"EntityName":"contact","PrimaryKeyName":"contactid"},"ViewName":"Contacts Lookup View"}] -->
            </div>
        </div>
    </div>

    <div id="sch_location_lookupmodal" style="display: none;">
        <div class="entity-lookup">
            <div class="entity-grid" data-view-layouts="W3siQ29uZmlndXJhdGlvbiI6eyJFbnRpdHlOYW1lIjoic2NoX2FkZHJlc3MiLCJQcmltYXJ5S2V5TmFtZSI6InNjaF9hZGRyZXNzaWQifSwiVmlld05hbWUiOiJBZGRyZXNzIExvb2t1cCBWaWV3In0seyJDb25maWd1cmF0aW9uIjp7IkVudGl0eU5hbWUiOiJzY2hfb2ZmaWNlIiwiUHJpbWFyeUtleU5hbWUiOiJzY2hfb2ZmaWNlaWQifSwiVmlld05hbWUiOiJPZmZpY2UgTG9va3VwIFZpZXcifV0=">
                <!-- Base64 encoded: [{"Configuration":{"EntityName":"sch_address","PrimaryKeyName":"sch_addressid"},"ViewName":"Address Lookup View"},{"Configuration":{"EntityName":"sch_office","PrimaryKeyName":"sch_officeid"},"ViewName":"Office Lookup View"}] -->
            </div>
        </div>
    </div>

    <h3>Additional Examples</h3>
    <input type="hidden" id="manual_lookup" />
    <input type="text" id="manual_lookup_name" readonly />
    <input type="hidden" id="manual_lookup_entityname" />

    <br><br>
    <input type="hidden" id="manual_poly_lookup" />  
    <input type="text" id="manual_poly_lookup_name" readonly />
    <input type="hidden" id="manual_poly_lookup_entityname" />

</body>
</html>
